version: '3.8'
 
services:
  mysql8:
    image: mysql:8
    container_name: mysql8
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: db_comercio
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_user
    ports:
      - "6034:3306"
    volumes:
      - mysql8data:/var/lib/mysql
    networks:
      - mysql-network
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma8
    depends_on:
      - mysql8
    environment:
      PMA_HOST: mysql8
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: toor
      MYSQL_ROOT_PASSWORD: toor
    restart: always
    ports:
      - "8081:80"
    networks:
      - mysql-network

networks:
  mysql-network:
    driver: bridge

volumes:
  mysql8data: